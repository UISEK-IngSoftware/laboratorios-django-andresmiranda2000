{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="alert alert-danger">
            <h5>¿Eliminar a {{ pokemon.name }}?</h5>
            <p class="mb-0">Esta acción no se puede deshacer.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Sí, eliminar</button>
            <a href="{% url 'index' %}" class="btn btn-secondary btn-sm">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
