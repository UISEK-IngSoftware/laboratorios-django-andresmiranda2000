<html>
    <head>
        <title>Entrenadores</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <div class="bg-success text-white p-4 text-center">
                <h1>Entrenadores Pokemon</h1>
            </div>
            <div class="p-2">
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'index' %}">Volver a pokemones</a>
            </div>
            <ul class="list-group">
                {% for trainer in trainers %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="{% url 'trainer' trainer.id %}">{{ trainer.name }}</a>
                    <span class="badge bg-primary rounded-pill">{{ trainer.pokemons.count }} pokemones</span>
                </li>
                {% empty %}
                <li class="list-group-item">No hay entrenadores registrados.</li>
                {% endfor %}
            </ul>
        </div>
    </body>
</html>
